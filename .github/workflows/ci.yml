name: CI Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint & Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install & Check Backend
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bun x @biomejs/biome check .

      - name: Install & Check Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint -- --max-warnings=0
          npm run format:check

      - name: Install & Check Docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Check Python Code (Cron)
        working-directory: cron
        run: |
          pip install black isort
          black --check .
          isort --check-only .

  build-backend-docker:
    name: Test Build Backend Docker
    runs-on: ubuntu-latest
    needs: [lint-and-format] 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend 
          file: ./backend/Dockerfile 
          push: false
          tags: backend:test
          cache-from: type=gha 
          cache-to: type=gha,mode=max

  build-frontend-docker:
    name: Test Build Frontend Docker
    runs-on: ubuntu-latest
    needs: [lint-and-format] 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false 
          tags: frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docs-docker:
    name: Test Build Docs Docker
    runs-on: ubuntu-latest
    needs: [lint-and-format] 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Docs Image
        uses: docker/build-push-action@v4
        with:
          context: ./docs
          file: ./docs/Dockerfile 
          push: false 
          tags: docs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-cron-docker:
    name: Test Build Cron Docker
    runs-on: ubuntu-latest
    needs: [lint-and-format] 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Cron Image
        uses: docker/build-push-action@v4
        with:
          context: ./cron
          file: ./cron/Dockerfile 
          push: false 
          tags: cron:test
          cache-from: type=gha
          cache-to: type=gha,mode=max