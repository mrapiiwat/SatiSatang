limit_req_zone $binary_remote_addr zone=api_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_chat:10m rate=5r/s;

server {
    listen 80;
    client_max_body_size 50M;
    client_header_timeout 10s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location ~ ^/api/(check-email|register|login|verify-email|refreshToken|resend-otp|forgot-password|reset-password|validate-recovery|google|facebook|logout) {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except GET POST PUT DELETE {
            deny all;
        }
    }

    location ~ ^/api/(sati|satang) {
        limit_req zone=api_chat burst=10 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; 
        proxy_cache off;     
        proxy_set_header Connection '';
        proxy_read_timeout 300s;

        limit_except GET POST PUT DELETE {
            deny all;
        }
    }

    location /api/ {
        limit_req zone=api_global burst=20 nodelay;
        proxy_pass http://backend:8080; 
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_body_timeout 10s;
        send_timeout 10s;

        limit_except GET POST PUT DELETE {
            deny all;
        }
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /docs/ {
        proxy_pass http://docs:3000/docs/; 
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /satisatang/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host; 
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}