<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>รหัสยืนยันตัวตนทางอีเมล</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        padding: 40px 20px;
        color: #1a1a1a;
      }

      .email-container {
        max-width: 480px;
        margin: 0 auto;
      }

      .header {
        margin-bottom: 40px;
      }

      .logo {
        width: 32px;
        height: 32px;
        display: block;
      }

      .content {
        font-size: 15px;
        line-height: 1.6;
        color: #525252;
        margin-bottom: 40px;
      }

      .otp-section {
        text-align: center;
        padding: 30px 0;
        margin: 40px 0;
        border-top: 1px solid #e5e5e5;
        border-bottom: 1px solid #e5e5e5;
      }

      .otp-code {
        font-size: 36px;
        font-weight: 600;
        color: #1a1a1a;
        letter-spacing: 8px;
        font-family: monospace;
      }

      .note {
        font-size: 13px;
        color: #737373;
        line-height: 1.6;
        margin-top: 40px;
      }

      .footer {
        font-size: 12px;
        color: #a3a3a3;
        margin-top: 60px;
        padding-top: 20px;
        border-top: 1px solid #f5f5f5;
      }

      @media (max-width: 600px) {
        body {
          padding: 30px 15px;
        }

        .otp-code {
          font-size: 30px;
          letter-spacing: 6px;
        }
      }
    </style>
  </head>

  <body>
    <div class="email-container">
      <div class="header" style="text-align: center; margin-bottom: 40px">
        <div
          style="
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 600;
            font-size: 20px;
            color: #1a1a1a;
          "
        >
          SATISATANG
        </div>
        <div
          style="
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 12px;
            color: #525252;
          "
        >
          สติสตางค์
        </div>
      </div>

      <div class="content">
        ขอบคุณที่ลงทะเบียนกับเรา<br />
        กรุณาใช้รหัสยืนยันด้านล่างเพื่อยืนยันอีเมลของคุณ
      </div>

      <div class="otp-section">
        <div class="otp-code">{{OTP_CODE}}</div>
      </div>

      <div class="note">
        รหัสนี้จะหมดอายุภายใน 10 นาที<br />
        หากคุณไม่ได้ทำรายการนี้ กรุณาเพิกเฉยต่ออีเมลฉบับนี้
      </div>

      <div class="footer">© {{CURRENT_YEAR}} สติสตางค์</div>
    </div>
  </body>
</html>
