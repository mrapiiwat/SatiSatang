name: SatiSatang
services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - satisatang-network

  frontend:
    build:
      context: ../frontend
      dockerfile: dockerfile
    env_file: ../frontend/.env
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - satisatang-network

  backend:
    build:
      context: ../backend
      dockerfile: dockerfile
    env_file: ../backend/.env
    volumes:
      - ../backend:/app
      - /app/node_modules
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant
      - minio
    networks:
      - satisatang-network

  db:
    build:
      context: ../db
      dockerfile: dockerfile
    container_name: satisatang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - satisatang_postgres_data:/var/lib/postgresql
    networks:
      - satisatang-network

  minio:
    image: minio/minio
    container_name: satisatang-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - satisatang_minio_data:/data
    networks:
      - satisatang-network

  qdrant:
    image: qdrant/qdrant:v1.3.0
    container_name: satisatang-qdrant
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - satisatang_qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - satisatang-network
      
  redis:
    image: redis:7
    container_name: satisatang-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - satisatang_redis_data:/data
    networks:
      - satisatang-network

networks:
  satisatang-network:
    driver: bridge

volumes:
  satisatang_postgres_data:
  satisatang_minio_data:
  satisatang_qdrant_data:
  satisatang_redis_data: