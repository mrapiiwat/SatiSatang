name: satisatang
services:
  web:
    build: 
      context: ../frontend
      dockerfile: dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - satisatang-network

  backend:
    build:
      context: ../backend
      dockerfile: dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - qdrant
      - redis
    networks:
      - satisatang-network

  cron-job:
    build:
      context: ../cron
      dockerfile: dockerfile
    container_name: cron-job
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - qdrant
    networks:
      - satisatang-network

  db:
    build:
      context: ../db
      dockerfile: dockerfile
    container_name: satisatang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - satisatang_postgres_data:/var/lib/postgresql
    networks:
      - satisatang-network

  qdrant:
    image: qdrant/qdrant:v1.3.0
    container_name: satisatang-qdrant
    volumes:
      - satisatang_qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - satisatang-network

  redis:
    image: redis:7
    container_name: satisatang-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - satisatang_redis_data:/data
    networks:
      - satisatang-network

networks:
  satisatang-network:
    driver: bridge

volumes:
  satisatang_postgres_data:
  satisatang_qdrant_data:
  satisatang_redis_data:
