services:
  postgres:
    image: postgres:16
    container_name: satisatang-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - satisatang_postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: satisatang-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - satisatang_minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.3.0
    container_name: satisatang-qdrant
    ports:
      - "${QDRANT_PORT}:6333"
    volumes:
      - satisatang_qdrant_data:/qdrant/storage
    restart: always

  redis:
    image: redis:7
    container_name: satisatang-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - satisatang_redis_data:/data

volumes:
  satisatang_postgres_data:
  satisatang_minio_data:
  satisatang_qdrant_data:
  satisatang_redis_data:
